[project]
name = "fieldhand"
version = "0.1.0"
description = "An economic game for bots: land, labour, coins and survival. No randomness."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Juan Carlos Oñate" }]
requires-python = ">=3.12"
keywords = ["game", "bots", "economy", "api", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/Naraka/fieldhand"
Issues = "https://github.com/Naraka/fieldhand/issues"

[project.scripts]
fieldhand = "fieldhand.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs/prototype"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
